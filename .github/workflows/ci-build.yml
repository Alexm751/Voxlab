name: "CI Flatpak"

# Voxlab: Linux x86_64 Flatpak only. No signing, no Windows/macOS.
# Triggers: manual + PRs into main (not every push).

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ci-flatpak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libvulkan-dev glslc spirv-headers

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

  flatpak:
    name: Flatpak x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder binutils

      - name: Add Flathub and install SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub \
            org.gnome.Platform//48 \
            org.gnome.Sdk//48 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08 \
            org.freedesktop.Sdk.Extension.llvm19//24.08

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Flatpak SDK prefix + Cargo
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-sdk-prefix
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: flatpak-src-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'bun.lock') }}
          restore-keys: |
            flatpak-src-${{ runner.os }}-

      - name: Build Flatpak (source inside SDK)
        run: |
          chmod +x scripts/build-flatpak.sh
          ./scripts/build-flatpak.sh

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxlab-flatpak-x86_64
          path: "*.flatpak"
          if-no-files-found: error
          retention-days: 14
