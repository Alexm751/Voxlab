name: "code quality"

# Voxlab: upstream multi-platform / release workflow kept for reference but
# auto-triggers removed. Use CI Flatpak (ci-build.yml) instead.

on:
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation consistency
        run: bun run check:translations

      - name: Check model language coverage
        run: bun run check:model-languages

      - name: Test keyboard utilities
        run: bun run test:keyboard

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier
        run: bun run format:check
